name: Release

# Trigger (either one):
# 1) Push a v* tag: git tag v1.1.0 && git push origin v1.1.0
# 2) GitHub web UI: Actions -> Release -> Run workflow, fill in the version
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the v prefix). Leave empty to use package.json'
        required: false
        type: string
      publish_npm:
        description: 'Also publish to the npm registry'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: false

permissions:
  contents: write
  # Required for npm Trusted Publishing: the workflow exchanges a short-lived OIDC
  # token for a publish credential, so no long-lived NPM_TOKEN secret is stored.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME}"
          INPUT_VERSION="${{ inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$RAW_TAG" == v* ]]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="$PKG_VERSION"
          fi

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, requested=$VERSION. Run 'npm version $VERSION' and commit first."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Verify before release
        run: npm run verify

      - name: Icon geometry
        run: python3 .verify/icon-weight.py

      - name: Build tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack --json > pack.json
          TARBALL="$(node -p "require('./pack.json')[0].filename")"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -lh "$TARBALL"

      - name: Generate checksums
        run: |
          TARBALL="${{ steps.pack.outputs.tarball }}"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Extract release notes
        run: |
          node .github/scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md
          head -40 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false

      # Runs after the GitHub Release so a missing/failed npm publish never costs
      # us the tagged release: the tarball is already downloadable either way.
      # continue-on-error keeps the run green while still reporting the problem.
      # Trusted Publishing: setup-node is given no token, so npm picks up the
      # OIDC identity this job was granted and exchanges it at publish time.
      # Register the workflow at
      # https://www.npmjs.com/package/dsh-promt-refine/access -> Trusted Publishers
      # (KukaNo996 / dsh-promt-refine / .github/workflows/release.yml).
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.publish_npm }}
        continue-on-error: true
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public
