name: Release

# Trigger (either one):
# 1) Push a v* tag: git tag v1.1.0 && git push origin v1.1.0
# 2) GitHub web UI: Actions -> Release -> Run workflow, fill in the version
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the v prefix). Leave empty to use package.json'
        required: false
        type: string
      publish_npm:
        description: 'Also publish to the npm registry'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: false

permissions:
  contents: write
  # Required for npm Trusted Publishing: the workflow exchanges a short-lived OIDC
  # token for a publish credential, so no long-lived NPM_TOKEN secret is stored.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # NOTE: `registry-url` is deliberately NOT set here.
      #
      # setup-node writes an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and injects the placeholder NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX when no
      # token secret is configured. npm then treats that placeholder as real
      # credentials and never falls back to OIDC, so the publish request is sent
      # unauthenticated and the registry answers 404 "not in this registry" instead
      # of a 401/403 (it will not confirm the package exists to an anonymous caller).
      # Leaving registry-url out keeps .npmrc free of an _authToken entry, which is
      # what lets npm use the OIDC identity granted by `id-token: write`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing needs npm >= 11.5.1, but the Node 22 distribution still
      # bundles npm 10.9.x. With an older npm the publish silently skips the OIDC
      # exchange and fails as an unauthenticated request, which surfaced as a
      # misleading 404/ENEEDAUTH on every release.
      - name: Upgrade npm for OIDC
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number)
            if (major > 11 || (major === 11 && minor >= 5)) {
              console.log("npm supports OIDC trusted publishing")
            } else {
              console.log("::error::npm " + process.argv[1] + " cannot use trusted publishing; need >= 11.5.1")
              process.exit(1)
            }
          ' "$NPM_VERSION"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME}"
          INPUT_VERSION="${{ inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$RAW_TAG" == v* ]]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="$PKG_VERSION"
          fi

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, requested=$VERSION. Run 'npm version $VERSION' and commit first."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Verify before release
        run: npm run verify

      - name: Icon geometry
        run: python3 .verify/icon-weight.py

      - name: Build tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack --json > pack.json
          TARBALL="$(node -p "require('./pack.json')[0].filename")"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -lh "$TARBALL"

      - name: Generate checksums
        run: |
          TARBALL="${{ steps.pack.outputs.tarball }}"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Extract release notes
        run: |
          node .github/scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md
          head -40 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false

      # Runs after the GitHub Release so a failed npm publish never costs us the
      # tagged release: the tarball is already downloadable either way.
      # Trusted Publishing: setup-node is given no token, so npm picks up the
      # OIDC identity this job was granted and exchanges it at publish time.
      #
      # The publish failure is reported through ::error:: and the job fails, rather
      # than being swallowed: a green run that silently skipped npm would hide a
      # broken release. The Release above is already created at this point, so the
      # job can be re-run or the tag re-pushed without losing the tarball.
      #
      # One-time npm setup (https://www.npmjs.com/package/dsh-prompt-optimization/access
      # -> Trusted Publishers -> Add -> GitHub Actions):
      #   Organization or user : KukaNo996
      #   Repository           : dsh-prompt-optimization
      #   Workflow filename    : release.yml      <-- FILE NAME ONLY, no path
      #   Environment name     : (leave empty)
      # npm matches the workflow by file name, so entering
      # ".github/workflows/release.yml" silently fails to bind and every publish
      # ends as a 404 "not in this registry".
      # Guard against the failure mode above recurring: an _authToken entry makes
      # npm ignore the OIDC identity and fail with an opaque 404. Fail loudly here
      # instead, with the file contents, rather than in the registry response.
      - name: Assert npm will use OIDC (no token in .npmrc)
        run: |
          set -euo pipefail
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npmrc: $NPMRC"
          if [ -f "$NPMRC" ]; then
            # Print key names only; never echo a credential value.
            sed -E 's/(_authToken=).*/\1<redacted>/' "$NPMRC" || true
          else
            echo "(no .npmrc present)"
          fi
          if [ -f "$NPMRC" ] && grep -q '_authToken' "$NPMRC"; then
            echo "::error::.npmrc contains _authToken, which disables npm Trusted Publishing. Remove registry-url/token from setup-node."
            exit 1
          fi
          echo "No _authToken present: npm will authenticate through OIDC."

      # Trusted Publishing makes npm staging the default: the CLI exits 0 after
      # handing the tarball to the registry's staged queue, WITHOUT publishing it.
      # The version then becomes publicly visible after a delay (observed:
      # 5-10 minutes). A green publish step therefore does not mean the version
      # is installable yet, and the staged copy blocks every retry with
      # 409 "previously staged version".
      # The version is verified against the public registry afterwards with a
      # patient poll that spans the staging window (40 × 15s = 10 minutes by
      # default, overridable via env). Only a real publish failure (auth,
      # network, conflict) fails the run; a version that is still absent after
      # the window is reported as a warning and the step still exits 0, because
      # the GitHub Release is already final at that point and npm's queue is
      # outside this workflow's control — failing the run there only produced
      # red releases whose artifacts were all fine.
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.publish_npm }}
        env:
          NPM_WAIT_ATTEMPTS: '40'
          NPM_WAIT_INTERVAL: '15'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if ! npm publish --registry=https://registry.npmjs.org --provenance --access public; then
            echo "::error::npm publish failed. The GitHub Release and its tarball are intact; fix the cause and re-run this workflow."
            exit 1
          fi
          echo "npm publish exited 0; waiting for $VERSION to become publicly installable"

          # The registry can lag minutes while the staged queue drains; poll
          # patiently instead of declaring failure after half a minute.
          for attempt in $(seq 1 "$NPM_WAIT_ATTEMPTS"); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/dsh-prompt-optimization/$VERSION" || true)"
            if [ "$CODE" = "200" ]; then
              echo "Version $VERSION is live on the npm registry (attempt $attempt/$NPM_WAIT_ATTEMPTS)"
              exit 0
            fi
            echo "attempt $attempt/$NPM_WAIT_ATTEMPTS: registry returned ${CODE:-<no response>}; retrying in ${NPM_WAIT_INTERVAL}s"
            sleep "$NPM_WAIT_INTERVAL"
          done

          echo "::warning::Version $VERSION is still not visible on the registry after $((NPM_WAIT_ATTEMPTS * NPM_WAIT_INTERVAL))s. It may still be sitting in npm's staged queue (https://www.npmjs.com/settings/kukano996npm/staged-packages) — the GitHub Release and its tarball are already final and unaffected. Check https://www.npmjs.com/package/dsh-prompt-optimization again in a few minutes."
          exit 0
