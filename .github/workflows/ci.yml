name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Icon balance is measured from a real headless render, so the runner
      # needs Pillow and a Chromium binary. Both are preinstalled or cheap here.
      - name: Install icon-check dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          command -v chromium || command -v chromium-browser || command -v google-chrome

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Manifest and asset validation
        run: node .github/scripts/validate-manifest.mjs

      - name: Locale consistency
        run: node .github/scripts/check-locales.mjs

      - name: Host half tests
        run: node .verify/host-test.mjs

      - name: Client half tests
        run: node .verify/client-test.mjs

      - name: Empty-draft hint animation
        run: node .verify/hint-animation-test.mjs

      - name: Update check
        run: node .verify/update-test.mjs

      - name: Composer model mode
        run: node .verify/composer-mode-test.mjs

      - name: Streaming and context-aware mode
        run: node .verify/stream-context-test.mjs

      - name: Localization tests
        run: node .verify/locale-test.mjs

      # The optimize and undo glyphs must keep the same optical centre, height and
      # ink weight: swapping the control's state must not shift the label baseline.
      # icon-weight.py measures a real browser render; it skips (exit 0) when no
      # Chromium is available rather than trusting an in-house rasterizer.
      - name: Icon geometry
        run: |
          node .verify/icon-test.mjs
          python3 .verify/icon-weight.py

      - name: Pack contents assertion
        run: |
          npm pack --dry-run --json > pack.json
          node .github/scripts/check-pack.mjs pack.json

      - name: No secrets in package
        run: node .github/scripts/scan-secrets.mjs

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse the one authoritative pack assertion instead of duplicating the
      # required-file list here: a second copy drifted when locale/zh.json was
      # split into zh-cn / zh-tw and broke this job while verify stayed green.
      - name: Pack and inspect tarball
        run: |
          npm pack --json > pack.json
          node -e "const p = require('./pack.json')[0]; console.log('package size:', p.size, 'unpacked:', p.unpackedSize);"
          node .github/scripts/check-pack.mjs pack.json
